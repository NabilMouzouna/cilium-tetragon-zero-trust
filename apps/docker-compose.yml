version: "3.9"

services:
  backend:
    build: ./backend
    container_name: nublenews-backend
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: nublenews-frontend
    ports:
      - "5173:5173"
    command: >
      sh -c "VITE_BACKEND_URL=http://backend:3001 npm run dev -- --host"
    depends_on:
      - backend

